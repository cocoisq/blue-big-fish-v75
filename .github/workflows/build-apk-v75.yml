
name: Build Blue Big Fish V75 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'V75-part-00'
      - 'V75-part-01'
      - 'V75-part-02'
      - 'V75-part-03'
      - 'V75-part-04'
      - '.github/workflows/build-apk-v75.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble V75 ZIP
        run: |
          cat V75-part-00 V75-part-01 V75-part-02 V75-part-03 V75-part-04 > V75.zip
          unzip -tq V75.zip

      - name: Extract Android project
        run: |
          unzip -q V75.zip -d source
          test -f source/TapMaidWidget_Release/settings.gradle.kts

      - name: Build debug APK
        working-directory: source/TapMaidWidget_Release
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blue-big-fish-v75-apk
          path: source/TapMaidWidget_Release/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
